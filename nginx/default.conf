server {
    listen 80;
    server_name _;

    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening. No X-Frame-Options / frame-ancestors on purpose:
    # VoltViz is embedded in an iframe by Home Assistant ingress.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The AI beat tracker's WebAssembly runtime compresses ~3.5x.
    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML shell names the hashed chunks of one build: always revalidate it,
    # or a cached copy asks for chunks a newer deploy no longer has (404).
    # "/" and the SPA fallback above both redirect internally to here.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # add_header in a location drops the server-level headers; re-add.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # The Google Cast receiver page (loaded by Chromecasts): same reasoning as index.html.
    location = /cast-receiver.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # security.txt etc. must never fall through to the SPA shell.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # nginx's stock mime.types has no .webmanifest entry (served as
    # application/octet-stream otherwise).
    location = /site.webmanifest {
        types {}
        default_type application/manifest+json;
    }

    # Beat model (loaded lazily when AI beat tracking starts).
    location /models/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in a location drops the server-level headers; re-add.
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
