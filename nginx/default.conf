server {
    listen 80;
    server_name _;

    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening. No X-Frame-Options / frame-ancestors on purpose:
    # VoltViz is embedded in an iframe by Home Assistant ingress.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # security.txt etc. must never fall through to the SPA shell.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # nginx's stock mime.types has no .webmanifest entry (served as
    # application/octet-stream otherwise).
    location = /site.webmanifest {
        types {}
        default_type application/manifest+json;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in a location drops the server-level headers; re-add.
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
